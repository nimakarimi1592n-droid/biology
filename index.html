<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biology 8/4/1405</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #071b30, #123d55);
    font-family: Tahoma;
    color: white;
    text-align: center;
}

.box {
    width: 85%;
    max-width: 420px;
    padding: 30px 20px;
    background: #ffffff12;
    border-radius: 25px;
}

h1 {
    font-size: 27px;
}

p {
    line-height: 2;
}

button {
    width: 100%;
    padding: 18px;
    margin-top: 20px;
    border: none;
    border-radius: 15px;
    background: #00d6a0;
    color: #06352b;
    font-size: 19px;
    font-weight: bold;
}

#message {
    display: none;
    margin-top: 20px;
    padding: 20px;
    background: #ffffff18;
    border: 1px solid #00d6a0;
    border-radius: 15px;
    font-size: 19px;
    line-height: 2;
}
</style>
</head>

<body>

<div class="box">
    <h1>Biology 8/4/1405</h1>
    <p>به گروه زیست‌شناسی خوش آمدید.</p>

    <button onclick="enter()">ورود به گروه</button>

    <div id="message"></div>
</div>

<script>
let clicked = false;

function enter() {
    if (!clicked) {
        const newTab = window.open("ad.html", "_blank");

        if (!newTab) {
            document.getElementById("message").style.display = "block";
            document.getElementById("message").innerText =
            "امکان باز کردن صفحه جدید وجود نداشت. لطفاً اجازه باز شدن پنجره‌ها را فعال کنید.";
            return;
        }

        clicked = true;

        document.getElementById("message").style.display = "block";
        document.getElementById("message").innerText =
        "صفحه جدید باز شد. پس از بازگشت به این صفحه، دوباره روی دکمه ورود به گروه بزنید.";

    } else {
        window.location.href = "https://t.me/+Mk3Yz5v9TAYyYjA8";
    }
}
</script>

</body>
</html>
